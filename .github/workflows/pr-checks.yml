name: PR offline checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: offline-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Static, smoke and security (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run checks without network interfaces
        id: tests
        # Only namespace creation is privileged. Node runs as the runner user,
        # with no capabilities and no ability to regain privileges via sudo.
        run: |
          mkdir -p test-results
          host_netns="$(readlink /proc/self/ns/net)"
          sudo unshare --net -- setpriv \
            --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            --no-new-privs -- "$(command -v node)" \
            scripts/run-offline-tests.cjs "$host_netns" > test-results/tests.tap 2>&1
      - name: Report results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo '## ゆるトレ倶楽部 PR検証'
            echo "検証結果: ${TEST_OUTCOME:-未実行}"
            echo '対象: JSX・日英辞書・体験版画面・ローカルRLS・投稿写真削除・退会時Storage障害'
            echo '本番DB接続なし。Secrets不要。デプロイ・マージは実行しません。'
            echo '詳細は tests.tap artifact を参照してください。'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/tests.tap ]; then cat test-results/tests.tap; fi
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-test-report
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
