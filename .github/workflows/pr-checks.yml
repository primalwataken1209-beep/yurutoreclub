name: PR offline checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: offline-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Static, smoke and security (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run checks in an isolated container
        id: tests
        # No runner command files, environment, Docker socket, or writable
        # workspace are exposed to PR-controlled test code.
        run: |
          mkdir -p test-results
          host_netns="$(readlink /proc/self/ns/net)"
          docker pull node:22-bookworm-slim
          runtime_image="$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-bookworm-slim)"
          echo "Test runtime: $runtime_image"
          docker run --rm --network none --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --pids-limit 128 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace --env HOME=/tmp --env TMPDIR=/tmp \
            "$runtime_image" node scripts/run-offline-tests.cjs "$host_netns" \
            > test-results/tests.tap 2>&1
      - name: Report results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo '## ゆるトレ倶楽部 PR検証'
            echo "検証結果: ${TEST_OUTCOME:-未実行}"
            echo '対象: JSX・日英辞書・体験版画面・ローカルRLS・投稿写真削除・退会時Storage障害'
            echo '本番DB接続なし。Secrets不要。デプロイ・マージは実行しません。'
            echo '詳細は tests.tap artifact を参照してください。'
          } >> "$GITHUB_STEP_SUMMARY"
          # Treat test output as data, never as GitHub workflow commands.
          report_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$report_token"
          if [ -f test-results/tests.tap ]; then cat test-results/tests.tap; fi
          echo "::$report_token::"
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-test-report
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
