  const [cmts,setCmts]=useState(null);        // null=未取得
  const [cmtProfiles,setCmtProfiles]=useState({});
  const [cmtCount,setCmtCount]=useState(initialCommentCount||0);
  const [inp,setInp]=useState('');
  const [msg,setMsg]=useState('');
  const [err,setErr]=useState('');
  const [cmtErr,setCmtErr]=useState('');
  /* 【v50新規追加】通報・ブロックの画面状態（既存stateは変更していない） */
  const [menuOpen,setMenuOpen]=useState(false);
  const [reportTarget,setReportTarget]=useState(null); // {type,id} or null
  const [blockAsk,setBlockAsk]=useState(false);
  const [blockBusy,setBlockBusy]=useState(false);
  const [blockErr,setBlockErr]=useState('');

  const name=snsDisplayName(author,isMine?(state.user&&state.user.name):null);
  const avatar=(author&&author.avatar_url)||(isMine&&state.user&&(state.user.avatarUrl||state.user.avatar))||null;

  const toggle=async(r)=>{
    if(busyType)return;
    const cur=rx[r.key]||{count:0,mine:false};
    const turnOn=!cur.mine;
    setBusyType(r.key);
    // 先に画面へ反映して、失敗したら戻す（連打しても数が二重に増えない）
    setRx(m=>({...m,[r.key]:{count:Math.max(0,cur.count+(turnOn?1:-1)),mine:turnOn}}));
    const res=await snsToggleReaction(me,post.id,r.key,turnOn,state.user);
    setBusyType(null);
    if(res.error){ setRx(m=>({...m,[r.key]:cur})); setErr(res.error); setTimeout(()=>setErr(''),2600); return; }
    if(turnOn){ setMsg(tl(r,'line')); setTimeout(()=>setMsg(''),2200); }   /* 【v50.2】日英対応 */
  };

  const openComments=async()=>{
    const next=!open; setOpen(next);
    if(next&&cmts===null){
      const r=await snsFetchComments(me,post.id);
      if(r.error){setCmtErr(r.error);setCmts([]);return;}
      setCmts(r.data.comments); setCmtProfiles(r.data.profiles); setCmtCount(r.data.comments.length);
    }
  };
  const sendComment=async()=>{
    /* 【v49】ローカル変数名 t が i18n の t() と衝突するため txt へ改名（処理は同一） */
    const txt=inp.trim(); if(!txt)return;
    /* 【v50.1新規追加】連投防止。前回のコメント成功から5秒あける */
    if(snsCooldownLeft('comment')>0){setCmtErr(t('safety.tooFastComment'));return;}
    setCmtErr('');
    const r=await snsAddComment(me,post.id,txt,state.user);
    if(r.error){setCmtErr(r.error);return;}
    snsMarkSent('comment');   /* 【v50.1】成功したときだけ記録する */
    setCmts(list=>[...(list||[]),r.data]);
    setCmtProfiles(m=>({...m,[me]:m[me]||{id:me,nickname:(state.user&&state.user.name)||'',avatar_url:(state.user&&state.user.avatarUrl)||null}}));
    setCmtCount(c=>c+1); setInp('');
    if(showToast)showToast(t('sns.cheered'));
  };
  const removePost=async()=>{
    const r=await snsSoftDeletePost(me,post.id,post.image_path);   /* 【v51.2】写真も削除 */
    if(r.error){setErr(r.error);return;}
    if(showToast)showToast(t('sns.deleted'));
    onDeleted&&onDeleted();
  };

  /* 【v50新規追加】ブロックの実行。成功したら、この投稿は自分の画面から消える。 */
  const doBlock=async()=>{
    if(blockBusy)return;
    setBlockBusy(true);setBlockErr('');
    const r=await snsSetBlock(me,post.user_id,true,state.user);
    setBlockBusy(false);
    if(r.error){setBlockErr(r.error);return;}
    setBlockAsk(false);
    if(showToast)showToast(t('legal.blockedToast'));
    onDeleted&&onDeleted();   // 一覧から取り除く（再読み込みでも消えたままになる）
  };

  const total=Object.keys(rx).reduce((n,k)=>n+((rx[k]&&rx[k].count)||0),0);
  return(
    <div className="post">
      <div className="post-head">
        <button type="button" onClick={()=>onOpenUser&&onOpenUser(post.user_id)}
          aria-label={name+t('sns.ofProfile')}
          style={{background:'none',border:0,padding:0,cursor:'pointer',display:'flex',alignItems:'center',gap:9,flex:1,minWidth:0,textAlign:'left',fontFamily:'inherit'}}>
          {avatar
            ?<img src={avatar} className="avatar" style={{objectFit:'cover'}} alt=""/>
            :<div className="avatar" style={{background:snsColorOf(post.user_id)}}>{snsInitial(author,name)}</div>}
          <div style={{flex:1,minWidth:0}}>
            <div className="post-name">{name}{isMine&&<span style={{color:'#4DB89E',fontSize:10,marginLeft:4}}>{t('sns.me')}</span>}</div>
            <div className="post-sub">{snsTimeText(post.created_at)}</div>
          </div>
        </button>
        {act&&<span className="act-tag">{act.icon} {tl(act)}</span>}
        {/* 【v50新規追加】通報・ブロックのメニュー。自分の投稿には出さない */}
        {!isMine&&me&&me!=='guest'&&(
          <button type="button" onClick={()=>setMenuOpen(true)} aria-label={t('legal.menuAria')}
            style={{background:'none',border:0,padding:'2px 4px',marginLeft:6,cursor:'pointer',
                    color:'#b0c8c0',fontSize:16,lineHeight:1,fontFamily:'inherit',flexShrink:0}}>…</button>
        )}
      </div>

      {post.body&&<div className="post-body">{post.body}</div>}
      {/* 【v51.2】写真つき投稿だけ表示。読めなかったら何も出さない（カードは崩さない） */}
      {post.image_path&&<SnsPostImage key={post.image_path} path={post.image_path}/>}

      <div className="reaction-panel">
        <div className="reaction-title">{t('sns.reactions')} {total>0&&<span>{total}</span>}</div>
        <div className="yuru-reactions">
          {YURU_REACTIONS.map(r=>{
            const c=rx[r.key]||{count:0,mine:false};
            return(
              <button key={r.key} type="button" title={tl(r,'line')}
                className={`yuru-reaction ${c.mine?'active':''}`} onClick={()=>toggle(r)}>
                <span className="reaction-emoji">{r.emoji}</span>
                <span className="reaction-label">{tl(r)}{c.count>0?` ${c.count}`:''}</span>
              </button>
            );
          })}
        </div>
        {msg&&<div className="reaction-bubble">🐼 {msg}</div>}
        {err&&<div className="reaction-mini" style={{color:'#c2683f'}}>{err}</div>}
      </div>

      <div className="post-foot">
        <button type="button" onClick={openComments}>{t('sns.commentsBtn')}{cmtCount>0?` ${cmtCount}`:''}</button>
        {isMine&&<button type="button" onClick={removePost} style={{marginLeft:'auto',color:'#b98a7a'}}>{t('sns.delete')}</button>}
      </div>

      {open&&(
        <div style={{marginTop:7}}>
          {cmts===null&&<div style={{fontSize:11.5,color:'#a0b8b0',padding:'6px 0'}}>{t('sns.loading')}</div>}
          {cmts&&cmts.length===0&&!cmtErr&&(
            <div style={{fontSize:11.5,color:'#a0b8b0',padding:'6px 0'}}>{t('sns.noComments')}</div>
          )}
          {(cmts||[]).map(c=>(
            <div key={c.id} style={{fontSize:12,color:'#4a6860',padding:'5px 0',borderTop:'1px solid #f0f7f5'}}>
              <button type="button" onClick={()=>onOpenUser&&onOpenUser(c.user_id)}
                style={{background:'none',border:0,padding:0,marginRight:5,cursor:'pointer',fontFamily:'inherit',
                        color:'#1a4038',fontWeight:800,fontSize:12}}>
                {snsDisplayName(cmtProfiles[c.user_id],c.user_id===me?(state.user&&state.user.name):null)}
              </button>
              {c.body}
              {/* 【v50新規追加】コメントの通報。自分のコメントには出さない */}
              {c.user_id!==me&&me&&me!=='guest'&&(
                <button type="button" onClick={()=>setReportTarget({type:'comment',id:c.id})}
                  style={{background:'none',border:0,padding:'0 0 0 6px',cursor:'pointer',fontFamily:'inherit',
                          color:'#c0d4ce',fontWeight:700,fontSize:10.5}}>{t('legal.reportComment')}</button>
              )}
            </div>
          ))}
          {cmtErr&&<div style={{fontSize:11.5,color:'#c2683f',padding:'6px 0'}}>{cmtErr}</div>}
          <div style={{display:'flex',gap:7,marginTop:9,paddingTop:7,borderTop:'1px solid #f0f7f5'}}>
            <input className="field" style={{flex:1,padding:'7px 11px',fontSize:12}} placeholder={t('sns.commentPh')}
              value={inp} onChange={e=>setInp(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&sendComment()} maxLength={SNS_COMMENT_MAX}/>
            <button type="button" onClick={sendComment}
              style={{color:'#4DB89E',fontWeight:700,fontSize:13,background:'none',border:'none',cursor:'pointer',fontFamily:'inherit'}}>{t('sns.send')}</button>
          </div>
        </div>
      )}

      {/* 【v50新規追加】メニュー／通報／ブロック確認 */}
      {menuOpen&&(
        <PostMenuSheetV50 canBlock={!isMine}
          onReport={()=>{setMenuOpen(false);setReportTarget({type:'post',id:post.id});}}
          onBlock={()=>{setMenuOpen(false);setBlockErr('');setBlockAsk(true);}}
          onClose={()=>setMenuOpen(false)}/>
      )}
      {reportTarget&&(
        <ReportSheetV50 targetType={reportTarget.type} targetId={reportTarget.id} me={me}
          showToast={showToast} onClose={()=>setReportTarget(null)}/>
      )}
      {blockAsk&&(
        <ConfirmSheetV50
          title={t('legal.blockTitle')}
          body={t('legal.blockBody',{name})}
          confirmLabel={t('legal.blockDo')} busyLabel={t('common.sending')}
          danger busy={blockBusy} error={blockErr}
          onConfirm={doBlock} onClose={()=>{ if(!blockBusy)setBlockAsk(false); }}/>
      )}
    </div>
  );
}

/* ═══════════════ 【v43】ほかの人のプロフィール ═══════════════
   タイムラインでアイコン／名前をタップすると開く。
   フォロワー数を大きく見せたり、ランキングを出したりはしない(§15)。 */
function SnsUserScreen({userId,state,onClose,onOpenUser,showToast}){
  const me=state&&state.auth;
  const isMe=userId===me;
  const [status,setStatus]=useState('loading');
  const [err,setErr]=useState('');
  const [prof,setProf]=useState(null);
  const [counts,setCounts]=useState({posts:0,following:0,followers:0});
  const [following,setFollowing]=useState(false);
  const [followBusy,setFollowBusy]=useState(false);
  const [feedData,setFeedData]=useState({posts:[],profiles:{},reactions:{},commentCounts:{}});
  const [reloadKey,setReloadKey]=useState(0);
  /* 【v50新規追加】ブロック状態 */
  const [blocked,setBlocked]=useState(()=>snsIsBlockedId(userId));
  const [blockAsk,setBlockAsk]=useState(false);
  const [blockBusy,setBlockBusy]=useState(false);
  const [blockErr,setBlockErr]=useState('');

  useEffect(()=>{
    let alive=true; setStatus('loading');
    Promise.all([
      snsFetchProfile(me,userId),
      snsFetchUserCounts(me,userId),
      snsFetchUserPosts(me,userId),
      isMe?Promise.resolve({data:false,error:null}):snsIsFollowing(me,userId)
    ]).then(([p,c,posts,f])=>{
      if(!alive)return;
      const bad=p.error||c.error||posts.error;
      if(bad){setErr(bad);setStatus('error');return;}
      setProf(p.data); setCounts(c.data);
      setFeedData({posts:posts.data.posts||[],profiles:posts.data.profiles||{},
             reactions:posts.data.reactions||{},commentCounts:posts.data.commentCounts||{}});
      setFollowing(!!f.data); setStatus('ready');
    });
    /* 【v50】最新のブロック状態を読み直す（他画面でブロックした直後にも合う） */
    snsLoadBlocks(me).then(()=>{ if(alive)setBlocked(snsIsBlockedId(userId)); });
    return ()=>{alive=false;};
  },[userId,me,reloadKey]);

  /* 【v50新規追加】ブロックの実行・解除 */
  const doSetBlock=async(on)=>{
    if(blockBusy||isMe)return;
    setBlockBusy(true);setBlockErr('');
    const r=await snsSetBlock(me,userId,on,state.user);
    setBlockBusy(false);
    if(r.error){setBlockErr(r.error);return;}
    setBlocked(on);
    setBlockAsk(false);
    if(on){ setFollowing(false); }
    if(showToast)showToast(on?t('legal.blockedToast'):t('legal.unblockedToast'));
  };

  const toggleFollow=async()=>{
    if(followBusy||isMe)return;
    setFollowBusy(true);
    const next=!following;
    setFollowing(next);
    setCounts(c=>({...c,followers:Math.max(0,c.followers+(next?1:-1))}));
    const r=await snsSetFollow(me,userId,next,state.user);
    setFollowBusy(false);
    if(r.error){
      setFollowing(!next);
      setCounts(c=>({...c,followers:Math.max(0,c.followers+(next?-1:1))}));
      setErr(r.error); setTimeout(()=>setErr(''),2600);
      return;
    }
    if(showToast)showToast(next?t('sns.followed'):t('sns.unfollowed'));
  };

  const name=snsDisplayName(prof,isMe?(state.user&&state.user.name):null);
  const avatar=(prof&&prof.avatar_url)||(isMe&&state.user&&(state.user.avatarUrl||state.user.avatar))||null;

  return(
    <div className="room-full-view">
      <div className="room-full-head">
        <button type="button" className="room-full-back" onClick={onClose}>{t('sns.back')}</button>
        <div className="room-full-title">{t('sns.profile')}</div>
        <div style={{width:104,flexShrink:0}}/>
      </div>
      <div className="room-full-body">
        {status==='loading'&&<SnsNotice icon="🌿" title={t('sns.loading')}/>}
        {status==='error'&&(
          <SnsNotice icon="🐼" title={err||t('sns.loadErr')} sub={t('sns.loadErrSub')}
            actionLabel={t('sns.reloadAgain')} onAction={()=>setReloadKey(k=>k+1)}/>
        )}
        {status==='ready'&&(
          <>
            <div className="card" style={{textAlign:'center'}}>
              {avatar
                ?<img src={avatar} alt="" style={{width:76,height:76,borderRadius:'50%',objectFit:'cover',margin:'0 auto 8px',display:'block'}}/>
                :<div style={{width:76,height:76,borderRadius:'50%',margin:'0 auto 8px',background:snsColorOf(userId),
                              color:'#fff',fontSize:30,fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {snsInitial(prof,name)}
                 </div>}
              <div style={{fontSize:16,fontWeight:900,color:'#1a4038'}}>{name}</div>
              {prof&&prof.region&&<div style={{fontSize:11.5,color:'#7aada0',marginTop:3}}>📍 {prof.region}</div>}
              {prof&&(prof.intro||prof.hitokoto)&&(
                <div style={{fontSize:12.5,color:'#4a6860',lineHeight:1.7,marginTop:9,whiteSpace:'pre-wrap',textAlign:'left'}}>
                  {prof.intro||prof.hitokoto}
                </div>
              )}
              <div style={{display:'flex',justifyContent:'center',gap:22,marginTop:14}}>
                {[[t('sns.posts'),counts.posts],[t('sns.following'),counts.following],[t('sns.followers'),counts.followers]].map(([l,v])=>(
                  <div key={l} style={{textAlign:'center'}}>
                    <div style={{fontSize:15,fontWeight:900,color:'#2f8a72'}}>{v}</div>
                    <div style={{fontSize:10.5,color:'#a0b8b0',marginTop:1}}>{l}</div>
                  </div>
                ))}
              </div>
              {!isMe&&(
                <button type="button" onClick={toggleFollow} disabled={followBusy}
                  style={{marginTop:14,width:'100%',borderRadius:14,padding:'11px',fontSize:13,fontWeight:900,
                          cursor:followBusy?'default':'pointer',fontFamily:'inherit',
                          border:following?'2px solid #d0ede5':'none',
                          background:following?'#fff':'linear-gradient(135deg,#5DCBA8,#3da888)',
                          color:following?'#4DB89E':'#fff'}}>
                  {following?t('sns.unfollow'):t('sns.follow')}
                </button>
              )}
              {isMe&&<div style={{marginTop:12,fontSize:11.5,color:'#a0b8b0'}}>{t('sns.selfProfile')}</div>}
              {/* 【v50新規追加】ブロック / 解除。控えめな見た目にする */}
              {!isMe&&me&&me!=='guest'&&(
                <button type="button" disabled={blockBusy}
                  onClick={()=>{ if(blocked)doSetBlock(false); else {setBlockErr('');setBlockAsk(true);} }}
                  style={{marginTop:9,width:'100%',borderRadius:14,padding:'10px',fontSize:12,fontWeight:800,
                          cursor:blockBusy?'default':'pointer',fontFamily:'inherit',
                          border:'1.5px solid #ecdcd4',background:'#fff',color:'#b9603f'}}>
                  {blocked?t('legal.unblock'):t('legal.block')}
                </button>
              )}
              {blockErr&&<div style={{fontSize:11.5,color:'#c2683f',marginTop:8}}>{blockErr}</div>}
              {err&&<div style={{fontSize:11.5,color:'#c2683f',marginTop:8}}>{err}</div>}
            </div>

            {blocked
              ?<SnsNotice icon="🚫" title={t('legal.blockedUser')} sub={t('legal.blockedHidden')}/>
              :feedData.posts.length===0
              ?<SnsNotice icon="🌱" title={t('sns.noPosts')} sub={isMe?t('sns.noPostsSubSelf'):t('sns.noPostsSubOther')}/>
              :feedData.posts.map(p=>(
                <SnsPostCard key={p.id} post={p} me={me} state={state}
                  author={feedData.profiles[p.user_id]||prof}
                  initialReactions={feedData.reactions[p.id]||{}}
                  initialCommentCount={feedData.commentCounts[p.id]||0}
                  onOpenUser={onOpenUser} showToast={showToast}
                  onDeleted={()=>setFeedData(t=>({...t,posts:t.posts.filter(x=>x.id!==p.id)}))}/>
              ))}
            <div style={{height:24}}/>
          </>
        )}
      </div>
      {/* 【v50新規追加】ブロック確認 */}
      {blockAsk&&(
        <ConfirmSheetV50
          title={t('legal.blockTitle')}
          body={t('legal.blockBody',{name})}
          confirmLabel={t('legal.blockDo')} busyLabel={t('common.sending')}
          danger busy={blockBusy} error={blockErr}
          onConfirm={()=>doSetBlock(true)} onClose={()=>{ if(!blockBusy)setBlockAsk(false); }}/>
      )}
    </div>
  );
}

/* ═══════════════ 【開発用】?debug=sns ═══════════════
   本番UIには一切表示しない。URLに ?debug=sns を付けたときだけ出る。
   v42までのダミー投稿も、ここでだけ見られるようにしてある。 */

    'uid: '+uid,
    'supabase: '+(supabaseClient?'接続あり':'なし'),
    'feed: '+feed+' / status: '+status,

        </div>

          const u=DEV_SAMPLE_USERS.find(x=>x.id===p.uid);

          );
        })}

    </div>
  );
}

function WeeklyScreen({state,streak,pct}){
  const [mode,setMode]=useState('week');
  const [monthOffset,setMonthOffset]=useState(0);
  // 【v36改善】月別記録の「すべて見る」開閉状態（新しい画面は追加しない）
  const [showAllMonth,setShowAllMonth]=useState(false);

  /* ── 7日間・1年のグラフ用データ（従来ロジックのまま維持） ──
     1か月は「今日から過去31日」ではなく暦カレンダーで描くため、ここでは作らない */
  const days=[];
  if(mode!=='month'){
    const span=mode==='week'?7:365;
    for(let i=span-1;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);
      const k=dk(d);const cnt=state.reports.filter(r=>dk(r.ts)===k).length;
      days.push({k,cnt,done:cnt>0,lbl:mode==='week'?t('week.dows')[d.getDay()]:d.getDate(),isToday:i===0});
    }
  }
  const maxC=Math.max(1,...days.map(d=>d.cnt));
  const bd={};state.reports.forEach(r=>{bd[r.aid]=(bd[r.aid]||0)+1});
  const bl=Object.entries(bd).sort((a,b)=>b[1]-a[1]).map(([id,cnt])=>({...ACTS.find(a=>a.id===id),cnt}));
  let comeback=0;for(let i=1;i<state.reports.length;i++){if((state.reports[i].ts-state.reports[i-1].ts)/86400000>=7)comeback++;}

  /* ── 表示中の年月（上部カレンダーと下部アルバムで共通） ── */
  const ms=monthActivitySummary(state.reports,monthOffset);
  const monthRows=state.reports.filter(r=>monthKey(r.ts)===`${ms.year}-${String(ms.month).padStart(2,'0')}`).sort((a,b)=>b.ts-a.ts);
  const mem=memoryCard(state);

  /* ── 月間カレンダーの組み立て（日曜始まり・7列） ── */
  const monthCounts={};                                   // 日付ごとの記録件数
  monthRows.forEach(r=>{const dd=new Date(r.ts).getDate();monthCounts[dd]=(monthCounts[dd]||0)+1;});
  const firstDow=new Date(ms.year,ms.month-1,1).getDay(); // その月の1日の曜日（0=日）
  const lastDate=new Date(ms.year,ms.month,0).getDate();  // その月の末日
  const calCells=[];
  for(let i=0;i<firstDow;i++)calCells.push(null);         // 月初の空きマス
  for(let d=1;d<=lastDate;d++)calCells.push(d);
  while(calCells.length%7!==0)calCells.push(null);        // 月末の空きマス（行を揃える）
  const nowD=new Date();
  const isThisMonth=nowD.getFullYear()===ms.year&&(nowD.getMonth()+1)===ms.month;
  const todayDate=nowD.getDate();

  /* ── 年月ナビゲーション（未来月へは移動不可・最古の記録月まで選択可能） ── */
  const curY=nowD.getFullYear(),curM=nowD.getMonth();
  let minOffset=0;
  if(state.reports.length){
    const oldest=new Date(Math.min(...state.reports.map(r=>r.ts)));
    minOffset=Math.min(0,(oldest.getFullYear()-curY)*12+(oldest.getMonth()-curM));
  }
  const monthOptions=[];
  for(let o=0;o>=minOffset;o--){const t2=new Date(curY,curM+o,1);monthOptions.push({v:o,label:t('week.ym',{y:t2.getFullYear(),m:ytMonthName(t2.getMonth())})});}
  const goMonth=(o)=>{setMonthOffset(Math.max(minOffset,Math.min(0,o)));setShowAllMonth(false);};
  const monthNav=(
    <div className="month-nav">
      <button className="mini-btn" onClick={()=>goMonth(monthOffset-1)} disabled={monthOffset<=minOffset}>{t('week.prevMonth')}</button>
      <select className="month-select" value={monthOffset} onChange={e=>goMonth(Number(e.target.value))} aria-label={t('week.pickMonth')}>
        {monthOptions.map(o=><option key={o.v} value={o.v}>{o.label}</option>)}
      </select>
      <button className="mini-btn" onClick={()=>goMonth(monthOffset+1)} disabled={monthOffset>=0}>{t('week.nextMonth')}</button>
      {monthOffset!==0&&<button className="mini-btn month-today-btn" onClick={()=>goMonth(0)}>{t('week.thisMonth')}</button>}
    </div>
  );

  const doneDays=mode==='month'?ms.days:days.filter(d=>d.done).length;

  return(
    <div className="fade-up">
      <PH msg={t('week.title')} sub={t('week.sub')} pct={pct}/>
      <div style={{padding:'10px 13px 0'}}>
        <div className="period-tabs">
          {[
            ['week',t('week.t7')],
            ['month',t('week.t1m')],
            ['year',t('week.t1y')]
          ].map(([id,label])=><button key={id} className={mode===id?'active':''} onClick={()=>setMode(id)}>{label}</button>)}
        </div>
      </div>
      <div style={{padding:'0 0 0'}}>
        <div className="card">
          <div className="card-title">📅 {mode==='week'?t('week.past7'):mode==='month'?t('week.ym',{y:ms.year,m:ytMonthName(ms.month-1)}):t('week.past1y')}</div>
          {mode==='month'&&monthNav}
          <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:11}}><span style={{fontSize:36,fontWeight:800,color:'#4DB89E'}}>{doneDays}</span><span style={{fontSize:14,color:'#7aada0'}}>{t('week.daysMoved')}</span></div>
          {mode==='month'?(
            /* 【v36改善】暦どおりの月間カレンダー（日〜土の7列） */
            <div className="month-cal">
              <div className="cal-dow-row">
                {t('week.dowList').split(',').map((w,i)=><div key={w} className={`cal-dow${i===0?' sun':i===6?' sat':''}`}>{w}</div>)}
              </div>
              <div className="cal-grid">
                {calCells.map((d,i)=>{
                  if(d===null)return <div key={`e${i}`} className="cal-cell empty"/>;
                  const c=monthCounts[d]||0;
                  const isToday=isThisMonth&&d===todayDate;
                  return(
                    <div key={d} className={`cal-cell${c>0?' done':''}${isToday?' today':''}`} title={t('week.calTitle',{y:ms.year,m:ytMonthName(ms.month-1),d:d,extra:(c>0?t('week.calExtra',{n:c}):'')})}>
                      <span className="cal-num">{d}</span>
                      {c===1&&<span className="cal-dot"/>}
                      {c>1&&<span className="cal-cnt">{c}</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          ):(
            <div className={mode==='year'?'year-heatmap':'week-bars'}>
              {days.map((d,i)=> mode==='week'?(
                <div key={d.k} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                  <div style={{width:'100%',borderRadius:'6px 6px 0 0',height:`${d.done?(d.cnt/maxC)*66+13:5}px`,background:d.done?(d.isToday?'#4DB89E':'#8dd8c0'):'#dceee8',transition:'height 0.5s ease'}}/>
                  <div style={{fontSize:10,color:d.isToday?'#4DB89E':'#a0b8b0',fontWeight:d.isToday?700:500}}>{d.lbl}</div>
                </div>
              ):(
                <div key={d.k} title={d.k} className={`heat-dot ${d.done?'done':''} ${d.isToday?'today':''}`}></div>
              ))}
            </div>
          )}
        </div>
        <div className="card memory-card">
          <div className="card-title">{t('week.nostalgia')}</div>
          <div className="memory-hero">
            <div><div className="memory-tag">{mem.tag}</div><div className="memory-title">{mem.title}</div><div className="memory-body">{mem.body}</div></div>
            <div className="memory-panda">📖</div>
          </div>
        </div>
        <div className="card">
          {/* 【v36調整】年月ナビは月間カレンダーカード側の1か所のみ。ここは見出しだけ表示（monthOffsetで連動） */}
          <div className="card-title" style={{marginBottom:4}}>🗓 {t('week.monthRecords',{y:ms.year,m:ytMonthName(ms.month-1)})}</div>
          <div style={{fontSize:12,color:'#7aada0',marginBottom:10}}>{t('week.movedDays',{n:ms.days,top:ms.top})}</div>
          {monthRows.length===0?(
            <div style={{fontSize:12,color:'#9bb8b0',lineHeight:1.7,background:'#f8fffc',borderRadius:14,padding:12}}>{t('week.noMonth')}</div>
          ):(
            <>
              {(showAllMonth?monthRows:monthRows.slice(0,8)).map(r=>{const a=ACTS.find(x=>x.id===r.aid);return(
                <div key={r.id} className="rec-row">
                  <div><div style={{fontSize:13,fontWeight:700,color:'#1a3030'}}>{a?.icon} {tl(a)}</div>{r.note&&<div style={{fontSize:11,color:'#a0b8b0',marginTop:1}}>{r.note}</div>}{r.photo&&<div className="rec-photo-mark">{t('home.photoMark')}</div>}</div>
                  {r.photo&&<img src={r.photo.dataUrl} className="rec-thumb" alt={t('alt.recPhoto')}/>}
                  <span className="rec-tag">{fmtDateJP(r.ts)}</span>
                </div>
              );})}
              {monthRows.length>8&&(
                <button className="month-more-btn" onClick={()=>setShowAllMonth(v=>!v)}>
                  {showAllMonth?t('week.close'):t('week.showAll',{n:monthRows.length})}
                </button>
              )}
            </>
          )}
        </div>
        {bl.length>0&&(
          <div className="card">
            <div className="card-title">{t('week.breakdown')}</div>
            {bl.map(b=>{const p=Math.round((b.cnt/state.reports.length)*100);return(
              <div key={b.id} style={{marginBottom:11}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontSize:13,fontWeight:600,color:'#1a3030'}}>{b.icon} {tl(b)}</span><span style={{fontSize:12,color:'#7aada0'}}>{b.cnt}{t('week.times')} ({p}%)</span></div>
                <div style={{height:7,background:'#e4f0ec',borderRadius:4}}><div style={{height:'100%',background:'linear-gradient(90deg,#5DCBA8,#3da888)',borderRadius:4,width:`${p}%`,transition:'width 0.6s ease'}}/></div>
              </div>
            );})}
          </div>
        )}
        <div className="card">
          <div className="card-title">{t('week.comeback')}</div>
          <div style={{display:'flex',alignItems:'baseline',gap:6,marginBottom:7}}><span style={{fontSize:36,fontWeight:800,color:'#ff6b6b'}}>{comeback}</span><span style={{fontSize:14,color:'#7aada0'}}>{t('week.comebackUnit')}</span></div>
          <div style={{fontSize:12,color:'#4a7060',lineHeight:1.75,background:'#fff5f5',borderRadius:12,padding:'9px 13px'}}>{t('week.comebackNote')}<br/><strong>{t('week.comebackNote2')}</strong>{t('week.comebackNote3')}</div>
        </div>
      </div>
    </div>
  );
}

function ProfileScreen({state,setState,showToast,onLogout,onDeleteAccount}){
  const [editing,setEditing]=useState(false);
  /* 【v50新規追加】アカウント削除の確認段階。
     0=閉じている / 1=1回目の確認 / 2=最終確認。ワンタップ即削除はしない。 */
  const [delStep,setDelStep]=useState(0);
  const [delBusy,setDelBusy]=useState(false);
  const [delErr,setDelErr]=useState('');
  const [name,setName]=useState(state.user.name);
  const [bio,setBio]=useState(state.user.bio||'');
  // 【v25新規追加】プロフィール項目の編集用state
  const [intro,setIntro]=useState(state.user.intro||'');            // 自己紹介文（最大150文字）
  const [avatar,setAvatar]=useState(state.user.avatar||null);       // プロフィール画像（dataURL）
  const [favActs,setFavActs]=useState(state.user.favActs||[]);      // 好きな運動（複数選択）
  const [pace,setPace]=useState(state.user.pace||'');               // 活動ペース
  const [region,setRegion]=useState(state.user.region||'未設定');   // 居住地域（任意）
  const [isPublic,setIsPublic]=useState(state.user.isPublic!==false); // 公開設定（初期値：公開）
  const [avatarErr,setAvatarErr]=useState('');
  const [saving,setSaving]=useState(false);
  const avatarFileRef=useRef(null);
  const total=state.reports.length;
  const streak=calcStreak(state.reports);
  const since=state.reports.length?dSince(state.reports[0].ts):0;
  const pct=Math.min(100,Math.max(5,Math.round((streak/30)*100)));

  // 編集開始時に最新の保存値をフォームへ反映する
  const startEdit=()=>{
    setName(state.user.name);setBio(state.user.bio||'');
    setIntro(state.user.intro||'');setAvatar(state.user.avatar||null);
    setFavActs(state.user.favActs||[]);setPace(state.user.pace||'');
    setRegion(state.user.region||'未設定');setIsPublic(state.user.isPublic!==false);
    setAvatarErr('');setEditing(true);
  };

  // プロフィール画像の選択（スマホの写真フォルダから選択 → 正方形トリミング＆圧縮）
  const pickAvatar=async(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setAvatarErr('');
    try{setAvatar(await readAvatarFile(file));}
    catch(err){setAvatarErr(err.message||t('photo.avatarErr'));}
    finally{if(avatarFileRef.current)avatarFileRef.current.value='';}
  };

  const toggleFav=(id)=>setFavActs(list=>list.includes(id)?list.filter(x=>x!==id):[...list,id]);

  // 保存処理：ローカル保存は必ず成功させ、Supabase(Storage/profiles)は可能なら同期する
  const save=async()=>{
    if(!name.trim()||saving)return;
    setSaving(true);
    try{
      let avatarUrl=state.user.avatarUrl||null;
      const avatarChanged=avatar!==state.user.avatar;
      if(avatarChanged&&avatar){
        // ログイン中ならSupabase Storageへアップロード（失敗してもdataURLで表示継続）
        avatarUrl=await uploadAvatarToSupabase(state.auth,avatar);
      }else if(!avatar){avatarUrl=null;}
      const nextUser={...state.user,
        name:name.trim(),bio:bio.trim(),intro:intro.trim(),
        avatar:avatar||null,avatarUrl,
        favActs,pace:pace||null,
        region:region==='未設定'?null:region,
        isPublic};
      setState(s=>({...s,user:nextUser}));
      syncProfileToSupabase(state.auth,nextUser); // profilesテーブルへも同期（未作成なら無視）
      snsEnsureProfile(state.auth,nextUser,{full:true}); // 【v43】SNS表示用の列(nickname/intro/region等)も更新（消した項目も反映）
      setEditing(false);
      showToast(t('profile.savedToast'));
    }catch(e){
      setAvatarErr(t('photo.saveErr'));
    }finally{
      setSaving(false); // エラー時もローディング状態を必ず解除
    }
  };

  /* 【v50新規追加】アカウント削除の実行（最終確認からのみ呼ばれる） */
  const runDelete=async()=>{
    if(delBusy||!onDeleteAccount)return;
    setDelBusy(true);setDelErr('');
    const r=await onDeleteAccount();
    setDelBusy(false);
    if(!r||!r.ok){
      // 失敗を「削除しました」と言わない。理由と次の行動だけを伝える。
      setDelErr((r&&r.error)||t('legal.delFail'));
      return;
    }
    // 成功時は親（AppLogic）がウェルカム画面へ戻すので、ここでは何もしない
  };

  if(editing)return(
    <div className="fade-up">
      <PH msg={t('profile.editTitle')} sub={t('profile.editSub')} pct={pct}/>
      <div style={{padding:'13px 0 100px'}}><div className="card">

        {/* プロフィール画像（丸型プレビュー） */}
        <div className="pf-avatar-wrap">
          {avatar
            ?<img src={avatar} className="pf-avatar" alt={t('alt.avatar')}/>
            :<div className="pf-avatar-fallback">{name.trim()?name.trim()[0]:'🐼'}</div>}
          <button type="button" className="pf-avatar-btn" onClick={()=>avatarFileRef.current&&avatarFileRef.current.click()}>{t('profile.photoChange')}</button>
          {avatar&&<button type="button" className="pf-avatar-del" onClick={()=>{setAvatar(null);setAvatarErr('');}}>{t('profile.photoDelete')}</button>}
          <input ref={avatarFileRef} type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" style={{display:'none'}} onChange={pickAvatar}/>
        </div>
        {avatarErr&&<div className="pf-err">{avatarErr}</div>}

        <label className="lbl">{t('profile.nick')}</label>
        <input className="field" style={{marginBottom:11}} value={name} onChange={e=>setName(e.target.value)} maxLength={20}/>

        <label className="lbl">{t('profile.bio')}</label>
        <textarea className="pf-textarea" value={intro} onChange={e=>setIntro(e.target.value.slice(0,150))} maxLength={150} placeholder={t('profile.bioPh')}/>
        <div className={`pf-counter${150-intro.length<=10?' warn':''}`}>{t('profile.charsLeft',{n:150-intro.length})}</div>

        <label className="lbl">{t('profile.oneline')}</label>
        <input className="field" style={{marginBottom:16}} value={bio} onChange={e=>setBio(e.target.value)} maxLength={40} placeholder={t('profile.onelinePh')}/>

        <label className="lbl">{t('profile.favActs')}</label>
        <div className="pf-chips">
          {FAV_ACT_OPTIONS.map(o=><button key={o.id} type="button" className={`pf-chip${favActs.includes(o.id)?' on':''}`} onClick={()=>toggleFav(o.id)}>{tl(o)}</button>)}
        </div>

        <label className="lbl">{t('profile.pace')}</label>
        <div className="pf-chips">
          {PACE_OPTIONS.map(o=><button key={o.id} type="button" className={`pf-chip${pace===o.id?' on':''}`} onClick={()=>setPace(p=>p===o.id?'':o.id)}>{tl(o)}</button>)}
        </div>

        <label className="lbl">{t('profile.area')}</label>
        <select className="pf-select" value={region} onChange={e=>setRegion(e.target.value)}>
          {PREF_LIST.map(p=><option key={p} value={p}>{p==='未設定'?t('misc.notSet'):prefLabel(p)}</option>)}
        </select>

        <div className="pf-toggle-row">
          <div>
            <div className="pf-toggle-label">{t('profile.publicOn')}</div>
            <div className="pf-toggle-sub">{t('profile.publicSub')}</div>
          </div>
          <button type="button" className={`pf-toggle${isPublic?' on':''}`} onClick={()=>setIsPublic(v=>!v)} aria-label={t('profile.publicAria')}><span/></button>
        </div>

        <button className="btn btn-primary" onClick={save} disabled={!name.trim()||saving}>{saving?t('profile.saving'):t('profile.save')}</button>
        <button className="btn-ghost" disabled={saving} onClick={()=>{setEditing(false);setAvatarErr('');}}>{t('common.cancel')}</button>
      </div></div>
    </div>
  );

  return(
    <div className="fade-up">
      <PH msg={t('ui.pfHeadMsg')} sub={t('ui.pfHeadSub')} pct={pct}/>
      <div style={{padding:'14px 13px 0',textAlign:'center'}}>
        {/* 【v25変更】プロフィール画像があれば丸型で表示、なければ従来のイニシャル表示 */}
        {state.user.avatar
          ?<img src={state.user.avatar} alt={t('alt.avatar')} style={{width:88,height:88,borderRadius:'50%',objectFit:'cover',margin:'0 auto 9px',display:'block',boxShadow:'0 8px 24px rgba(77,184,158,0.38)',border:'3px solid #fff'}}/>
          :<div style={{width:88,height:88,borderRadius:'50%',background:'linear-gradient(145deg,#5DCBA8,#3da888)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:34,fontWeight:700,color:'white',margin:'0 auto 9px',boxShadow:'0 8px 24px rgba(77,184,158,0.38)'}}>{state.user.name[0]}</div>}
        <div style={{fontSize:20,fontWeight:800,color:'#1a4038'}}>{state.user.name}</div>
        {since>0&&<div style={{fontSize:11,color:'#7aada0',marginTop:2}}>{t('profile.since')}</div>}
        {state.user.bio&&<div style={{fontSize:12,color:'#7aada0',marginTop:3}}>{state.user.bio}</div>}
        {state.user.intro&&<div style={{fontSize:12,color:'#4a6a60',marginTop:7,lineHeight:1.7,padding:'0 20px',whiteSpace:'pre-wrap'}}>{state.user.intro}</div>}
        {/* 【v25新規追加】好きな運動・活動ペース・地域・公開設定のタグ表示 */}
        {((state.user.favActs||[]).length>0||state.user.pace||state.user.region||state.user.isPublic===false)&&(
          <div className="pf-tags">
            {(state.user.favActs||[]).map(id=>{const o=FAV_ACT_OPTIONS.find(x=>x.id===id);return o?<span key={id} className="pf-tag">{tl(o)}</span>:null;})}
            {state.user.pace&&<span className="pf-tag">🗓 {tl(PACE_OPTIONS.find(x=>x.id===state.user.pace))}</span>}
            {state.user.region&&<span className="pf-tag">📍 {prefLabel(state.user.region)}</span>}
            {state.user.isPublic===false&&<span className="pf-tag" style={{background:'#f4f4f0',borderColor:'#e0e0d8',color:'#8a8a80'}}>{t('profile.private')}</span>}
          </div>
        )}
        <div style={{marginTop:9,display:'flex',gap:7,justifyContent:'center',flexWrap:'wrap'}}>
          <button onClick={startEdit} style={{padding:'5px 16px',border:'2px solid #4DB89E',borderRadius:999,color:'#4DB89E',fontWeight:700,fontSize:12,background:'white',cursor:'pointer',fontFamily:'inherit'}}>{t('profile.edit')}</button>
          <div style={{padding:'6px 14px',borderRadius:999,background:'linear-gradient(135deg,#4DB89E,#3da888)',color:'white',fontWeight:700,fontSize:12}}>{t('profile.keepGoing')}</div>
        </div>
      </div>
      <div style={{padding:'0 13px'}}>
        <div className="stat-row">
          <div className="stat-box"><div className="stat-num">{since||47}</div><div className="stat-unit">{t('profile.statDays')}</div></div>
          <div className="stat-box"><div className="stat-num">{total||38}</div><div className="stat-unit">{t('profile.statCount')}</div></div>
          <div className="stat-box"><div className="stat-num">{Object.values(state.likes).filter(Boolean).length||12}</div><div className="stat-unit">{t('profile.statCheer')}</div></div>
        </div>
        <div className="card" style={{background:'linear-gradient(135deg,#ecfaf5,#d4f0e8)'}}>
          <div style={{fontSize:13,color:'#1a3030',lineHeight:1.8,fontStyle:'italic',textAlign:'center'}}>{t('ui.pfSince',{days:(since||47),name:state.user.name})}</div>
        </div>
        <div className="card">
          <div className="card-title">{t('home.recentTitle')}</div>
          {state.reports.length===0?(
            <>
              <div className="rec-row"><div><div style={{fontSize:13,fontWeight:600,color:'#1a3030'}}>🚶 {tl(ACTS[0])}</div><div style={{fontSize:11,color:'#a0b8b0',marginTop:1}}>{t('demo.today')}</div></div><span className="rec-tag">{t('misc.minutes',{n:30})}</span></div>
              <div className="rec-row"><div><div style={{fontSize:13,fontWeight:600,color:'#1a3030'}}>🧘 {tl(ACTS[2])}</div><div style={{fontSize:11,color:'#a0b8b0',marginTop:1}}>{t('demo.yest')}</div></div><span className="rec-tag">{t('misc.minutes',{n:15})}</span></div>
            </>
          ):(
            state.reports.slice(-4).reverse().map(r=>{const a=ACTS.find(x=>x.id===r.aid);return(
              <div key={r.id} className="rec-row">
                <div><div style={{fontSize:13,fontWeight:600,color:'#1a3030'}}>{a?.icon} {tl(a)}</div>{r.note&&<div style={{fontSize:11,color:'#a0b8b0',marginTop:1}}>{r.note}</div>}{r.photo&&<div className="rec-photo-mark">{t('home.photoMark')}</div>}</div>
                {r.photo&&<img src={r.photo.dataUrl} className="rec-thumb" alt={t('alt.recPhoto')}/>}
                <span className="rec-tag">{fmtTs(r.ts)}</span>
              </div>
            );})
          )}
        </div>
        <button onClick={onLogout} style={{width:'100%',padding:12,borderRadius:14,border:'1.5px solid #dceee8',background:'white',color:'#a0b8b0',fontSize:13,cursor:'pointer',fontFamily:'inherit',marginBottom:4}}>{t('profile.logout')}</button>

        {/* ═══ 【v50新規追加】ブロックしたユーザーの解除（必要最低限のUI） ═══ */}
        <BlockedUsersPanelV50 state={state} showToast={showToast}/>

        {/* ═══ 【v50新規追加】規約・プライバシーへのリンク ═══ */}
        <LegalLinks/>

        {/* ═══ 【v50新規追加】アカウント削除。
               ログアウトより目立たせない（枠線だけの控えめな見た目）。 ═══ */}
        {state.auth&&state.auth!=='guest'&&(
          <button type="button" onClick={()=>{setDelErr('');setDelStep(1);}}
            style={{width:'100%',padding:11,borderRadius:14,border:'1px solid #f0e2da',background:'white',
                    color:'#c08a78',fontSize:12,cursor:'pointer',fontFamily:'inherit',
                    marginTop:6,marginBottom:22}}>{t('legal.deleteAccount')}</button>
        )}
        {(!state.auth||state.auth==='guest')&&<div style={{height:18}}/>}
      </div>

      {/* 1回目の確認 */}
      {delStep===1&&(
        <ConfirmSheetV50
          title={t('legal.del1Title')}
          body={t('legal.del1Body')}
          confirmLabel={t('legal.del1Go')}
          danger busy={false} error={delErr}
          onConfirm={()=>{setDelErr('');setDelStep(2);}}
          onClose={()=>setDelStep(0)}/>
      )}
      {/* 最終確認（ここではじめて実行される） */}
      {delStep===2&&(
        <ConfirmSheetV50
          title={t('legal.del2Title')}
          body={t('legal.del2Body')}
          confirmLabel={t('legal.del2Confirm')}
          danger busy={delBusy} error={delErr}
          note={delErr?t('legal.delFailContact'):null}
          onConfirm={runDelete}
          onClose={()=>{ if(!delBusy)setDelStep(0); }}/>
      )}
    </div>
  );
}

/* ═══════════════ デバイスフレーム ═══════════════ */
function IOSDevice(){
  return(
    <div className="frame-ios">
      <div className="ios-island"/>
      <div className="ios-statusbar" style={{paddingTop:14}}/>
      <DevCtx.Provider value="ios"><AppLogic devId="ios"/></DevCtx.Provider>
    </div>
  );
}
function AndroidDevice(){
  return(
    <div className="frame-android">
      <div className="android-camera"/>
      <div className="android-statusbar"/>
      <DevCtx.Provider value="android"><AppLogic devId="android"/></DevCtx.Provider>
      <div className="android-navbar">
        <span className="android-nav-btn">◀</span>
        <span className="android-nav-btn" style={{fontSize:22}}>⬤</span>
        <span className="android-nav-btn">■</span>
      </div>
    </div>
  );
}

/* ═══════════════ OS判定（新規追加） ═══════════════ */
// 【修正内容】アクセスしている端末のOSを判定し、該当する画面だけを表示します。
// ・画面幅では判定しません（OS判定とレスポンシブ対応は別物のため）
// ・iPadOSはMacのようなuserAgentを名乗ることがあるため、
//   「MacIntel かつ タッチ対応」の場合もiOSとして判定します
const getDeviceOS=()=>{
  const userAgent=navigator.userAgent||'';
  const platform=navigator.platform||'';

  // Android判定
  if(/android/i.test(userAgent)){
    return 'android';
  }

  // iOS判定（iPhone / iPad / iPod ＋ デスクトップ表示モードのiPad対策）
  const isIOS=
    /iPad|iPhone|iPod/.test(userAgent)||
    (platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isIOS){
    return 'ios';
  }

  // それ以外（Windows / Mac / Linux等のパソコン）
  return 'desktop';
};

/* ═══════════════ 【v44】ビルド番号（どの版が公開されているかの確認用） ═══════════════
   「直したはずなのに直っていない」の多くは、古いビルドが公開されたままか、
   ブラウザに古いページが残っているのが原因。すぐ確認できるように番号を持たせる。
   ・ブラウザのコンソールに 1行出る
   ・window.__YURUTORE_BUILD__ で読める
   ・URLに ?build=1 を付けると画面の右下に小さく出る（通常表示には一切出ない） */
const APP_BUILD='v44';
try{
  window.__YURUTORE_BUILD__=APP_BUILD;
  console.log('[ゆるトレ倶楽部] build '+APP_BUILD+' / device-preview: production disabled');
}catch(e){}

function buildStampOn(){
  try{return new URLSearchParams(window.location.search).get('build')==='1';}catch(e){return false;}
}

/* ═══════════════ 【v44】いま開発環境かどうか ═══════════════
   localhost / 127.0.0.1 / ::1 / *.local / file:// を開発環境とみなす。
   Netlify などの本番ホストは、ここで必ず false になる。 */
function isLocalDevHost(){
  try{
    const h=(window.location.hostname||'').toLowerCase();
    return h===''||h==='localhost'||h==='127.0.0.1'||h==='::1'||h==='[::1]'||h.endsWith('.local');
  }catch(e){return false;}
}

/* ═══════════════ 【v44】デバイスプレビュー（iPhone/Androidを左右に並べる確認用画面） ═══════════════
   v43.1 で「?preview=1 を付けたときだけ」に絞ったが、それでも
   ・URLに ?preview=1 が残ったまま共有／ブックマークされた
   ・古いビルドがキャッシュされている
   といった経路で、本番ユーザーに2画面が出てしまう可能性が残っていた。
   → v44 では「開発環境(localhost)で、かつ ?preview=1」の両方が成立したときだけに変更。
     本番ホスト(https://yurutore-club.netlify.app/ など)では、URLに何を付けても
     2画面のデバイスプレビューは絶対に表示されない。 */
function devPreviewOn(){
  try{
    if(!isLocalDevHost())return false;
    return new URLSearchParams(window.location.search).get('preview')==='1';
  }catch(e){return false;}
}

function Root(){
  // 【修正内容】OS判定は初回レンダー時に1回だけ行う（途中で変わることはないため）
  const [deviceOS]=useState(getDeviceOS);
  const [preview]=useState(devPreviewOn);
  const [stamp]=useState(buildStampOn);

  /* 実機（スマホ）のときはbodyに目印クラスを付け、CSS側で余白を消す。
     PCでは従来どおり枠まわりに余白を残す（見た目を変えないため）。 */
  useEffect(()=>{
    if(preview)return;
    if(deviceOS==='android'||deviceOS==='ios'){
      document.body.classList.add('is-real-device');
      return()=>document.body.classList.remove('is-real-device');
    }
  },[deviceOS,preview]);

  /* ═══════════════ 【v43.1】本番はアプリ1画面だけ ═══════════════
     v43までは、PCからのアクセスだけ「ゆるトレ倶楽部 — デバイスプレビュー」という
     iPhone/Androidを2つ並べた確認用ページを表示していた。
     これは開発時の確認用で、本番ユーザー向けの画面ではない。
     しかもアプリ本体(AppLogic)が2つ同時に動くため、
     ログイン・ログアウトの状態が2画面で別々に動いてしまう問題もあった。
     → 本番導線から完全に除外し、どの端末でもアプリを1つだけ表示する。
       Android端末はAndroidの枠、それ以外(iPhone/iPad/PC)はiPhoneの枠を使う。
     ※確認用のプレビューは ?preview=1 を付けたときだけ出る（下） */
  if(preview){
    return(
      <div>
        <div className="page-title">ゆるトレ倶楽部 — デバイスプレビュー（開発環境限定 ?preview=1）</div>
        <div className="devices-row">
          <div className="device-col"><div className="device-label">iPhone (iOS)</div><IOSDevice/></div>
          <div className="device-col"><div className="device-label">Android</div><AndroidDevice/></div>
        </div>
      </div>
    );
  }

  /* ═══════════════ 【v44】ここから下は「必ず1台だけ」 ═══════════════
     端末判定(getDeviceOS)は 'android' / 'ios' / 'desktop' の3つしか返さない。
     判定できなかった場合も 'desktop' に落ちるだけで、
     「判定不能なら両方表示する」というフォールバックは存在しない。
     → Android なら Android の枠、それ以外(iPhone/iPad/PC/判定不能)は iPhone の枠。
       どの経路をたどっても、返す端末枠は常に1つ。 */
  if(deviceOS==='android'){
    return(
      <div className="real-device">
        <AndroidDevice/>
        {stamp&&<BuildStamp/>}
      </div>
    );
  }
  // iPhone / iPad / PC / 判定不能 はすべてiPhoneの枠でアプリを1つだけ表示する
  return(
    <div className={deviceOS==='ios'?'real-device':''}>
      <IOSDevice/>
      {stamp&&<BuildStamp/>}
    </div>
  );
}

/* 【v44】?build=1 のときだけ右下に出る、公開中のビルド番号。
   通常の画面には一切表示されないので、デザインへの影響はない。 */
function BuildStamp(){
  return(
    <div style={{position:'fixed',right:6,bottom:6,zIndex:99999,pointerEvents:'none',
      background:'rgba(0,0,0,.55)',color:'#fff',fontSize:10,lineHeight:'14px',
      padding:'2px 6px',borderRadius:7,fontFamily:'inherit'}}>
      build {APP_BUILD}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

</body>
